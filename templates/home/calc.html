<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Django Template Tags Example</h1>
    {% if x > 0 %}
    <div>{{x}} = +VE number</div>
    {% elif x < 0 %}
    <div>{{x}} = -VE number</div>
    {% else %}
    <div>Zero</div>
    {% endif %}
</body>
</html>
