<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <header class="modal-header">
            <h2>Displaying Task Info</h2>
        </header>
        {% if tasks %}
        {% for task in tasks %}
        <div class="container card p-3 m-3">
            <form method="POST" action="{% url 'updateRoute' tid=task.task_id %}">
                {% csrf_token %}
            <p class="form-group alert alert-info">Title : 
                <input type="text" name="editTitle" required class="form-control" value="{{task.title}}">
            </p>
            <p class="form-group alert alert-success">Description : 
                <textarea name="editDesc" required class="form-control" value="{{task.description}}" rows="10" cols="30">{{task.description}}</textarea>
            </p>
            <p class="form-group alert alert-danger">Created : {{task.created}}</p>
            <button class="btn btn-sm btn-outline-info">UPDATE</button>
            <a class="btn btn-sm btn-outline-danger" href="{% url 'deleteRoute' tid=task.task_id %}" onclick="return confirm('Do you want to delete?');">DELETE</a>
            </form>
        </div>
        {% endfor %}
        {% endif %}
    </div>
    <a href="{% url 'showall' %}">Back</a>
</body>
</html>
